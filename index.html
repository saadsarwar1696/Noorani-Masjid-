<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style id="sty">
:root{--bg:#dde0b8;--card:#fff;--ink:#1a1a1a;--line:#bdbdbd;--cur:#858f36;--curink:#fff;--red:#c62828;--flash:#ffd9d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
html,body{height:100%;margin:0}
html{overflow:hidden;background:#dde0b8}
body{--u:min(1vw,.56vh);background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;display:flex;flex-direction:column;padding:calc(var(--u)*2);box-sizing:border-box;overflow:hidden}
header{display:flex;flex-direction:column;align-items:center;padding:0 calc(var(--u)*1)}
#mname{font-size:calc(var(--u)*5);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
#clock{font-family:Orbitron,monospace;font-weight:700;font-size:calc(var(--u)*11);line-height:1.1}
#clock small{font-family:Barlow,sans-serif;font-size:calc(var(--u)*3);font-weight:500;margin-left:.3em}
#dates{text-align:center;font-size:calc(var(--u)*3.4);font-weight:500;line-height:1.5;letter-spacing:.05em}
#bar{margin:calc(var(--u)*1.5) 0;min-height:calc(var(--u)*6);display:flex;align-items:center;justify-content:space-between;font-size:calc(var(--u)*3.2);font-weight:600;padding:0 calc(var(--u)*1.5);border-radius:4px}
#bar.mk{background:var(--red);color:#fff;font-size:calc(var(--u)*4);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
#msg small{display:block;font-size:.8em;font-weight:500}
#bar.cd{background:var(--cur);color:#fff;font-size:calc(var(--u)*5);font-weight:600}
@keyframes flash{50%{background:var(--flash);color:var(--red)}}
#edit{background:none;border:2px solid var(--red);color:var(--red);border-radius:50%;width:calc(var(--u)*5);height:calc(var(--u)*5);font-size:calc(var(--u)*3);font-weight:700;cursor:pointer;flex:none}
#grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);grid-gap:calc(var(--u)*2);gap:calc(var(--u)*2);min-height:0}
.card{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.27);padding:calc(var(--u)*1.2) calc(var(--u)*1.5);display:flex;flex-direction:column;min-height:0}
.card.cur{background:var(--cur);color:var(--curink)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid currentColor;flex:1.15}
.hd b{font-weight:500;font-size:calc(var(--u)*5);line-height:1}.hd i{display:block;font-style:normal;font-size:calc(var(--u)*3.3)}
.hd .t{font-size:calc(var(--u)*7);font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;flex:1;border-bottom:1px solid var(--line);font-size:calc(var(--u)*3.6)}
.r:last-child{border:0}.r .t{font-weight:600;font-size:calc(var(--u)*4.3)}
.r.mk{animation:flash 1s steps(1) infinite}
input{width:calc(var(--u)*19);font:inherit;font-weight:600;font-size:calc(var(--u)*3.6);text-align:center;border:2px solid var(--cur);border-radius:4px;background:#fff;color:#000}
input:focus{outline:4px solid var(--red)}
input[readonly]{background:#e3e3e3;color:#555;border-color:#999}
#tools{display:none;gap:calc(var(--u)*2);align-items:center;font-size:calc(var(--u)*3);padding:0 0 calc(var(--u)*1.5);flex-wrap:wrap}
body.ed #tools{display:flex}
#tools button{font:inherit;font-weight:600;padding:.3em .9em;border-radius:6px;border:2px solid var(--cur);background:var(--card);color:var(--ink)}
#tools button:focus{outline:4px solid var(--red)}
#off{width:calc(var(--u)*7)}
body.dk{--bg:#15180b;--card:#222713;--ink:#dfe4b4;--line:#3f4922;--cur:#7a8630;--curink:#f6f8e0;--flash:#5e2a24}
body.r90,body.r270{position:fixed;top:0;left:0;width:100vh;height:100vw;--u:min(1vh,.56vw);transform-origin:top left}
body.r90{transform:translateX(100vw) rotate(90deg)}
body.r270{transform:translateY(100vh) rotate(-90deg)}
body.r180{transform:rotate(180deg)}
#blk{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:#000;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#blk.on{display:flex}
#bn{font-size:calc(var(--u)*6);font-weight:600;letter-spacing:.1em;color:#bbb}
#bt{font-family:Orbitron,monospace;font-weight:700;font-size:calc(var(--u)*26);line-height:1.1;white-space:nowrap}
.d{display:inline-block;width:.84em;text-align:center}
.c{display:inline-block;width:.3em;height:.72em;position:relative}
.c::before,.c::after{content:'';position:absolute;left:50%;width:.1em;height:.1em;margin-left:-.05em;background:currentColor}
.c::before{top:.2em}.c::after{top:.5em}
</style>
</head>
<body>
<header><div id="mname">Noorani Masjid</div><div id="clock"></div><div id="dates"></div></header>
<div id="bar"><span id="msg"></span><button id="edit" title="Edit times">&#9998;</button></div>
<div id="tools"><b>Version 20</b> <span id="jsrc"></span> Auto: Karachi method, Hanafi Asr. Type a time like 1:30 to override; jamaat can be +5 (minutes after start), azan can be -10 (minutes before jamaat); clear a box to go back to auto &nbsp;|&nbsp; Hijri date shift (days): <input id="off" value="0"> <button id="done">Done</button> <button id="rot">Rotate: 0&deg;</button> <button id="reset">Reset all</button> <button id="test">Test blink</button> <button id="test2">Test countdown</button> <button id="dmb">Night: Auto</button> <button id="test3">Test dark</button> <span id="dkinfo"></span></div>
<div id="grid"></div>
<div id="blk"><div id="bn"></div><div id="bt"></div></div>
<script>
const DEF={fajr:{start:"05:21",jamaat:"05:50",sunrise:"06:35",ishraq:"06:55",chasht:"09:29"},
zohar:{start:"12:24",jamaat:"13:30",zawaal:"12:19",qh:"16:35",qs:"15:43"},
asr:{start:"16:35",jamaat:"17:45",hanafi:"16:35",shafai:"15:43",qaza:"18:12"},
maghrib:{start:"18:15",jamaat:"18:20",sunset:"18:12",iftaar:"18:15",qaza:"19:26"},
isha:{start:"19:26",jamaat:"",qaza:"05:21",tahajjud:"03:29",sahoor:"05:11"},
juma:{khutba:"13:45",k1:"",k2:"",k3:"",k4:""}};
const CARDS=[["fajr","Fajr","Start",[["jamaat","Jamaat"],["sunrise","Qaza/Sunrise"],["ishraq","Ishraaq"],["chasht","Chaasht"]]],
["zohar","Zohar","Start",[["jamaat","Jamaat"],["zawaal","Zawaal"],["qh","Qaza (Hanafi)"],["qs","Qaza (Shafai)"]]],
["asr","Asr","Start",[["jamaat","Jamaat"],["hanafi","Start (Hanafi)"],["shafai","Start (Shafai)"],["qaza","Qaza"]]],
["maghrib","Maghrib","Start",[["jamaat","Jamaat"],["sunset","Sunset"],["iftaar","Iftaar"],["qaza","Qaza"]]],
["isha","Isha","Start",[["jamaat","Jamaat"],["qaza","Qaza"],["tahajjud","Tahajjud"],["sahoor","Sahoor End"]]],
["juma","Juma","Khutba",[["k1","Khutba 1"],["k2","Khutba 2"],["k3","Khutba 3"],["k4","Khutba 4"]]]];
const HM=["Muharram","Safar","Rabi ul awwal","Rabi ul aakhir","Jumaad ul oola","Jumaad ul aakhira","Rajab","Shabaan","Ramzaan","Shawwal","Zil Qaada","Zil Hijja"];
const KEY="masjidBoardV2";
/* Mumbai (19.0760 N, 72.8777 E), University of Islamic Sciences Karachi (Fajr 18, Isha 18), Hanafi Asr */
const LAT=19.076,LON=72.8777,TZ=5.5;
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function calc(d){
 const r=Math.PI/180,sn=x=>Math.sin(x*r),cs=x=>Math.cos(x*r),H=h=>hm(h*60);
 const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5+(12-TZ)/24;
 const D=jd-2451545,g=(357.529+.98560028*D)%360,q=(280.459+.98564736*D)%360;
 const L=(q+1.915*sn(g)+.02*sn(2*g))%360,e=23.439-3.6e-7*D;
 let RA=Math.atan2(cs(e)*sn(L),cs(L))/r/15;RA=((RA%24)+24)%24;
 let eq=q/15-RA;eq=((eq+12)%24+24)%24-12;
 const dec=Math.asin(sn(e)*sn(L))/r,noon=12+TZ-LON/15-eq;
 const t=a=>Math.acos((-sn(a)-sn(dec)*sn(LAT))/(cs(dec)*cs(LAT)))/r/15;
 const as=f=>noon+t(-Math.atan(1/(f+Math.tan(Math.abs(LAT-dec)*r)))/r);
 const fj=noon-t(18),sr=noon-t(.833),ss=noon+t(.833),is=noon+t(18),ah=as(2),af=as(1),zw=noon-4/60;
 return{fajr:{start:H(fj),sunrise:H(sr),ishraq:H(sr+.3333),chasht:H((sr+zw)/2)},
 zohar:{start:H(noon+1/60),zawaal:H(zw),qh:H(ah),qs:H(af)},
 asr:{start:H(ah),hanafi:H(ah),shafai:H(af),qaza:H(ss)},
 maghrib:{start:H(ss+.05),sunset:H(ss),iftaar:H(ss+.05),qaza:H(is)},
 isha:{start:H(is),qaza:H(fj),tahajjud:H(fj-1.8667),sahoor:H(fj-.1667)}}}
let _d="",_a={};
function auto(){const k=new Date().toDateString();if(k!==_d){_d=k;_a=calc(new Date())}return _a}
const defO=()=>{const o={};["fajr","zohar","asr","maghrib"].forEach(p=>o[p+".jamaat"]=DEF[p].jamaat);o["maghrib.jamaat"]="+5";o["juma.khutba"]=DEF.juma.khutba;return o};
let cfg;
try{cfg=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!cfg||!cfg.o)cfg={o:defO(),off:0};
let ed=false,force=0,cdT=0;
let fileJ={};
function dkNorm(on,a,b){a=parseInt(a,10);b=parseInt(b,10);const o=String(on).toLowerCase();return{on:!(on===false||o==="off"||o==="false"||o==="no"||o==="0"),a:(isFinite(a)&&a>=0&&a<=600)?a:60,b:(isFinite(b)&&b>=0&&b<=600)?b:60}}
let dkCfg=dkNorm(true,60,60),dkForce=0;
try{const sd=JSON.parse(localStorage.getItem('masjidDark'));if(sd&&typeof sd==='object')dkCfg=dkNorm(sd.on,sd.a,sd.b)}catch(e){}
try{const sv=JSON.parse(localStorage.getItem('masjidTimesFile'));if(sv&&typeof sv==='object')fileJ=sv}catch(e){}
function setU(){const r=cfg.rot||0,w=window.innerWidth,h=window.innerHeight,u=(r===90||r===270)?Math.min(h/100,w*.0056):Math.min(w/100,h*.0056);document.body.style.setProperty('--u',u+'px');const st=document.getElementById('sty');if(window._css===undefined)window._css=st.textContent;let o=document.getElementById('sz');if(!o){o=document.createElement('style');o.id='sz';document.head.appendChild(o)}o.textContent=window._css.replace(/calc\(var\(--u\)\*([\d.]+)\)/g,function(m,n){return (u*parseFloat(n)).toFixed(2)+'px'})}
window.addEventListener('resize',setU);
function applyRot(){setU();const r=cfg.rot||0,b=document.body;b.classList.remove('r90','r180','r270');if(r)b.classList.add('r'+r);$('rot').innerHTML='Rotate: '+r+'&deg;'}
const $=id=>document.getElementById(id);
const fw=s=>s.replace(/./g,c=>c===':'?'<span class="c"></span>':'<span class="d">'+c+'</span>');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}};
const mins=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?+m[1]*60+ +m[2]:null};
const f12=s=>{const m=mins(s);if(m==null)return"--:--";let h=Math.floor(m/60)%12||12;return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const ap=s=>Math.floor(mins(s)/60)>=12?"PM":"AM";
const norm=v=>{v=v.trim().replace(/[.\s]/g,":");let m=/^(\d{1,2}):?(\d{2})$/.exec(v);if(!m)return"";let h=+m[1],n=+m[2];return h<24&&n<60?String(h).padStart(2,"0")+":"+String(n).padStart(2,"0"):""};
function render(){
 $("grid").innerHTML=CARDS.map(([id,name,sub,rows])=>{
  const sw=id!=="juma",hk=sw?"jamaat":"khutba",sb=sw?"Jamaat":sub,rw=sw?[["start","Start"]].concat(rows.slice(1)):rows;
  const cell=k=>ed?`<input data-k="${id}.${k}" value="${evd(id,k)}" maxlength="8" placeholder="hh:mm" inputmode="numeric"${fileJ[id+"."+k]?" readonly":""}>`:`<span class="t" data-v="${id}.${k}"></span>`;
  return `<div class="card" id="c-${id}"><div class="hd"><div><b>${name}</b><i>${sb}</i></div>${cell(hk)}</div>`+
   rw.map(([k,l])=>`<div class="r" data-r="${id}.${k}"><span>${l}</span>${cell(k)}</div>`).join("")+`</div>`}).join("");
 document.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{const[a,b]=i.dataset.k.split("."),key=a+"."+b;let v=i.value.trim();
  if(!((b==="jamaat"&&/^\+\d{1,3}$/.test(v))||(b==="azan"&&/^-\d{1,3}$/.test(v))))v=p12(v,T(a,b)||(a==="fajr"?"05:00":"13:00"));
  if(!v||v===(auto()[a]||{})[b])delete cfg.o[key];else cfg.o[key]=v;save();i.value=evd(a,b)});
 tick();
}
const T0=(a,b)=>{const o=fileJ[a+"."+b]||cfg.o[a+"."+b];
 if(b==="azan"&&!(o&&o[0]!=="-")){const j=mins(T(a,"jamaat")),n=o?+o.slice(1):15;return j!=null?hm(j-n):T(a,"start")}
 if(o){if(o[0]==="+"){const s=mins(T(a,"start"));return s==null?"":hm(s+ +o.slice(1))}return o}
 return (auto()[a]||{})[b]||""};
const T=(a,b)=>{const r=T0(a,b);if(b!=="jamaat")return r;const m=mins(r);if(m==null)return r;if(a==="fajr")return m>=720?hm(m-720):r;return m<720?hm(m+720):r};
const ev=(a,b)=>fileJ[a+"."+b]||cfg.o[a+"."+b]||T(a,b);
const evd=(a,b)=>{const v=ev(a,b);return /^\d{1,2}:\d{2}$/.test(v)?f12(v):v};
function p12(v,cur){v=v.trim().toLowerCase();const m=/^(\d{1,2})[:.\s]?(\d{2})\s*([ap])?\.?m?\.?$/.exec(v);if(!m)return"";let h=+m[1],n=+m[2];if(n>59)return"";
 if(m[3]){if(h<1||h>12)return"";h=h%12;if(m[3]==="p")h+=12}
 else if(h>=13||h===0){if(h>23)return""}
 else{const c=mins(cur);const pm=c==null?true:c>=720;h=h%12;if(pm)h+=12}
 return String(h).padStart(2,"0")+":"+String(n).padStart(2,"0")}
function tick(){
 const d=new Date(),now=d.getHours()*60+d.getMinutes(),sec=d.getSeconds();
 let h=d.getHours()%12||12;
 $("clock").innerHTML=fw(String(h).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(sec).padStart(2,"0"));
 let hd="";
 try{const x=new Date(d.getTime()+(cfg.off||0)*864e5);const p={};
  new Intl.DateTimeFormat("en-u-ca-islamic-civil",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(x).forEach(o=>p[o.type]=o.value);
  hd=parseInt(p.day)+" "+HM[parseInt(p.month)-1]+" "+parseInt(p.year)}catch(e){}
 $("dates").innerHTML=d.toLocaleDateString("en-GB",{day:"numeric",month:"long"})+", "+d.toLocaleDateString("en-GB",{weekday:"short"})+" "+d.getFullYear()+" &nbsp;|&nbsp; "+hd;
 if(!ed)document.querySelectorAll("[data-v]").forEach(e=>{const[a,b]=e.dataset.v.split(".");e.textContent=f12(T(a,b==="start"?"start":b))});
 const order=["fajr","zohar","asr","maghrib","isha"];let cur="isha";
 order.forEach(p=>{const m=mins(T(p,"start"));if(m!=null&&m<=now)cur=p});
 if(d.getDay()===5&&cur==="zohar")cur="juma";
 CARDS.forEach(c=>$("c-"+c[0])&&$("c-"+c[0]).classList.toggle("cur",c[0]===cur));
 {let dk=false,S0=null,E0=null;
  const ijv=mins(T("isha","jamaat")),fjv=mins(T("fajr","jamaat")),im=ijv!=null?ijv:mins(T("isha","start")),fm=fjv!=null?fjv:mins(T("fajr","start"));
  if(dkCfg.on&&im!=null&&fm!=null){const S=(im+dkCfg.a)%1440,E=(((fm-dkCfg.b)%1440)+1440)%1440;S0=S;E0=E;dk=S<=E?(now>=S&&now<E):(now>=S||now<E)}
  if(cfg.dmode===1)dk=false;else if(cfg.dmode===2)dk=true;
  if(Date.now()<dkForce)dk=true;
  document.body.classList.toggle("dk",dk);document.documentElement.style.background=dk?"#15180b":"#dde0b8";
  const di=$("dkinfo"),pt=m=>m<720?"morning":(m<1020?"afternoon":(m<1260?"evening":"night"));
  if(di)di.textContent=!dkCfg.on?"Night mode is off in times.json. ":(im!=null&&fm!=null?"Isha jamaat "+f12(hm(im))+" "+pt(im)+": dark starts "+dkCfg.a+" min after it. Fajr jamaat "+f12(hm(fm))+" "+pt(fm)+": light returns "+dkCfg.b+" min before it. Dark now: "+(dk?"yes":"no")+". ":"");
 }
 const W=[["Sunrise","fajr.sunrise","fajr.ishraq","none"],["Zawaal","zohar.zawaal","zohar.start","none"],["Sunset","maghrib.sunset","maghrib.start","maghrib.sunset"]];
 let act=null;
 W.forEach(([n,s,e,row])=>{const a=mins(T(...s.split("."))),b=mins(T(...e.split(".")));
  const on=a!=null&&b!=null&&now>=a&&now<b;if(on)act={n,e:T(...e.split("."))};
  const r=document.querySelector(`[data-r="${row}"]`);if(r)r.classList.toggle("mk",on)});
 const tst=Date.now()<force;if(tst&&!act)act={n:"Sunrise (TEST)",e:T("fajr","ishraq")};
 
 let cd=null;[["fajr","Fajr"],["zohar","Zohar"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"]].forEach(([p,n])=>{let m=mins(T(p,"jamaat")),k=false;if(p==="zohar"&&d.getDay()===5){let q=mins(T("juma","khutba"));if(q!=null){if(q<720)q+=720;m=q;k=true}}if(m!=null){const df=m*60-(now*60+sec);if(df>0&&df<=59)cd={n:k?"Juma Khutba":n,df,k}}});
 if(Date.now()<cdT)cd={n:"Test",df:Math.ceil((cdT-Date.now())/1000)};
 const bar=$("bar");bar.classList.toggle("mk",!!act&&!cd);bar.classList.toggle("cd",!!cd);
 $("blk").classList.toggle("on",!!cd);if(cd){$("bn").textContent=cd.n.toUpperCase()+(cd.k?" IN":" JAMAAT IN");$("bt").innerHTML=fw(String(Math.floor(cd.df/60)).padStart(2,"0")+":"+String(cd.df%60).padStart(2,"0"));$("msg").textContent=""}else if(act)$("msg").textContent="\u26A0 MAKRUH WAQT \u2013 "+act.n+" \u2013 ends "+f12(act.e);
 else{const ev=[];[["fajr","Fajr"],["zohar","Zohar"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"]].forEach(([p,n])=>{
   ev.push([mins(T(p,"jamaat")||T(p,"start")),n,T(p,"jamaat")||T(p,"start"),T(p,"azan")]);});
  const nx=ev.filter(x=>x[0]!=null).sort((a,b)=>a[0]-b[0]);
  const n=nx.find(x=>x[0]>now)||nx[0];
  $("msg").textContent=""}
}
$("edit").onclick=()=>{ed=true;document.body.classList.add("ed");$("off").value=cfg.off||0;render();document.querySelector("input[data-k]").focus()};
$("done").onclick=()=>{ed=false;document.body.classList.remove("ed");cfg.off=parseInt($("off").value)||0;save();render();$("edit").focus()};
$("reset").onclick=()=>{if(confirm("Reset all times to defaults?")){cfg={o:defO(),off:0};save();$("off").value=0;dmLabel();applyRot();render()}};
$("rot").onclick=()=>{cfg.rot=((cfg.rot||0)+90)%360;save();applyRot()};
$("test").onclick=()=>{force=Date.now()+10000;tick()};
function dmLabel(){$("dmb").textContent=["Night: Auto","Night: Always light","Night: Always dark"][cfg.dmode||0]}
$("dmb").onclick=()=>{cfg.dmode=((cfg.dmode||0)+1)%3;save();dmLabel();tick()};
$("test3").onclick=()=>{dkForce=Date.now()+10000;tick()};
$("test2").onclick=()=>{cdT=Date.now()+59000;tick()};
function loadTimes(){
