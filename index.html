<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style id="sty">
:root{--bg:#dde0b8;--card:#fff;--ink:#1a1a1a;--line:#bdbdbd;--cur:#858f36;--curink:#fff;--red:#c62828;--flash:#ffd9d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
html,body{height:100%;margin:0}
html{overflow:hidden;background:#dde0b8}
body{--u:min(1vw,.56vh);background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;display:flex;flex-direction:column;padding:calc(var(--u)*2);box-sizing:border-box;overflow:hidden}
header{display:flex;flex-direction:column;align-items:center;padding:0 calc(var(--u)*1)}
#mname{font-size:calc(var(--u)*5);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
#clock{font-family:Orbitron,monospace;font-weight:700;font-size:calc(var(--u)*11);line-height:1.1}
#clock small{font-family:Barlow,sans-serif;font-size:calc(var(--u)*3);font-weight:500;margin-left:.3em}
#dates{text-align:center;font-size:calc(var(--u)*3.4);font-weight:500;line-height:1.5;letter-spacing:.05em}
#bar{margin:calc(var(--u)*1.5) 0;min-height:calc(var(--u)*6);display:flex;align-items:center;justify-content:space-between;font-size:calc(var(--u)*3.2);font-weight:600;padding:0 calc(var(--u)*1.5);border-radius:4px}
#bar.mk{background:var(--red);color:#fff;font-size:calc(var(--u)*4);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
#msg small{display:block;font-size:.8em;font-weight:500}
#bar.cd{background:var(--cur);color:#fff;font-size:calc(var(--u)*5);font-weight:600}
@keyframes flash{50%{background:var(--flash);color:var(--red)}}
#edit{background:none;border:2px solid var(--red);color:var(--red);border-radius:50%;width:calc(var(--u)*5);height:calc(var(--u)*5);font-size:calc(var(--u)*3);font-weight:700;cursor:pointer;flex:none}
#grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);grid-gap:calc(var(--u)*2);gap:calc(var(--u)*2);min-height:0}
.card{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.27);padding:calc(var(--u)*1.2) calc(var(--u)*1.5);display:flex;flex-direction:column;min-height:0}
.card.cur{background:var(--cur);color:var(--curink)}
